name: flowmira

# Flowmira: nginx (frontend + API proxy) -> flowmira-diagram (diagrams API)
#                                      -> flowmira-erd     (database ERDs API)
#                                      -> flowmira-db      (PostgreSQL: Flowmira's own data)
# Run:  docker compose up -d --build     Open: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    container_name: flowmira-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowmira}
      POSTGRES_USER: ${POSTGRES_USER:-flowmira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Diagrams module: SIPOC, DMAIC, Swimlane, Flowchart, Architecture, Personas
  backend:
    build: ./backend
    container_name: flowmira-diagram
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowmira}:${POSTGRES_PASSWORD:-rootpass}@db:5432/${POSTGRES_DB:-flowmira}
      CORS_ORIGINS: http://localhost:${APP_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  # ERD module: reads database schemas (view only) and stores DBML diagrams
  erd:
    build: ./erd
    container_name: flowmira-erd
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowmira}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-flowmira}
      CORS_ORIGINS: http://localhost:${APP_PORT:-8080}
      # Optional: restrict which database servers may be inspected (see .env.example)
      ERD_ALLOWED_HOSTS: ${ERD_ALLOWED_HOSTS:-}
    extra_hosts:
      # lets users inspect a database running on the Docker host as "host.docker.internal"
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/erd/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: flowmira-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      erd:
        condition: service_healthy

volumes:
  pgdata:
