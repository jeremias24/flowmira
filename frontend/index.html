<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowmira</title>
    <script>
      // Apply the saved theme before the app loads (avoids a light flash in dark mode).
      try {
        var p = localStorage.getItem("flowmira-theme") || "system";
        var d =
          p === "dark" ||
          (p === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
