server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker's internal DNS. Re-resolve "backend" every 10s so a restarted
    # backend container (new IP) is found again instead of returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $erd_upstream http://erd:8001;

    # ── NEW ── Asks the diagrams API whether this browser's session is a system owner.
    # 204 = yes, 401 = not signed in, 403 = signed in but not an owner.
    location = /_auth/owner {
        internal;
        proxy_pass $backend_upstream/api/auth/check?role=owner;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @erd_401 {
        default_type application/json;
        return 401 '{"detail":"Not signed in. Open Flowmira from the IPC portal."}';
    }
    location @erd_403 {
        default_type application/json;
        return 403 '{"detail":"Database diagrams (ERD) are for Flowmira system owners only."}';
    }

    # ERD module -> flowmira-erd (longest prefix wins, so this goes before /api/)
    location /api/erd/ {
        # ── NEW ── System Owner / Super User only. The ERD service itself is unchanged and has
        # no published port, so this is the only way in.
        auth_request /_auth/owner;
        error_page 401 = @erd_401;
        error_page 403 = @erd_403;
        proxy_pass $erd_upstream;
        proxy_connect_timeout 5s;
        # reading a large schema over a slow link can take a while
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Diagrams API -> flowmira-diagram
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise browsers keep loading an old build
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
